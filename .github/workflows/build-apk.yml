name: Build APK

# Manual only — nothing runs on push. Start it from the Actions tab
# ("Build APK" -> "Run workflow") or with: gh workflow run "Build APK"
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which APK to build'
        type: choice
        options: [debug, release]
        default: release
      run_tests:
        description: 'Run the test suite first'
        type: boolean
        default: true
      publish:
        description: 'Publish the APK as a GitHub Release (release variant only)'
        type: boolean
        default: true
      title:
        description: 'Short release title, e.g. "Converter touch target fix" (optional)'
        type: string
      draft:
        description: 'Create as a draft instead of publishing straight away'
        type: boolean
        default: false

permissions:
  contents: write   # create releases
  actions: write    # delete the APK artifact once it is on the release

jobs:
  build:
    name: Build ${{ inputs.variant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The tag is derived from versionName in build.gradle.kts, which stays the source of truth
      # for the version as it has been for every release so far. Deriving it makes a mismatched
      # tag impossible rather than merely detectable.
      - name: Work out the release tag
        id: version
        run: |
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$version_name" ]; then
            echo "::error::could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "tag=v${version_name}" >> "$GITHUB_OUTPUT"
          echo "versionName ${version_name} -> tag v${version_name}"

      # Checked before the build so a run that cannot publish fails in seconds, not five minutes.
      - name: Check publish inputs
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.variant }}" != "release" ]; then
            echo "::error::publish requires variant=release — every published release so far ships app-release.apk"
            exit 1
          fi
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::release ${{ steps.version.outputs.tag }} already exists."
            echo "::error::Bump versionCode and versionName in app/build.gradle.kts first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # signingConfigs.release reads ${user.home}/.android/debug.keystore. Put a keystore at that
      # exact path so the build works with no change to build.gradle.kts.
      #
      # With the ANDROID_KEYSTORE_BASE64 secret set, that is the same key local builds use and the
      # APK installs straight over an existing copy. Without it, one is generated here so the build
      # still succeeds — Android cannot install an unsigned APK, so signing with *something* is not
      # optional. That key differs every run, so those APKs need the old version uninstalled first.
      - name: Provide a signing keystore
        if: inputs.variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Signed with the project keystore — installs over an existing copy." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so a throwaway key was generated."
            echo "::warning::Uninstall any existing ACALC before installing this APK."
            {
              echo "### Signed with a generated CI key"
              echo ""
              echo "Uninstall any existing copy of ACALC before installing this APK — Android"
              echo "refuses to update an app when the signature changes, and this key is new"
              echo "every run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Unit tests and the Robolectric Compose UI tests both run on the JVM,
      # so the whole suite works on a plain runner with no emulator.
      - name: Run tests
        if: inputs.run_tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew ${{ inputs.variant == 'release' && 'assembleRelease' || 'assembleDebug' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acalc-${{ inputs.variant }}-apk
          path: app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: inputs.run_tests && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      # Matches the existing releases: tag vX.Y, title "vX.Y — short description" (or just the tag
      # when no title is given), and one asset named app-release.apk. Always a full release —
      # --prerelease is never passed — and marked latest.
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          name="$TAG"
          if [ -n "$TITLE" ]; then
            name="$TAG — $TITLE"
          fi
          # --generate-notes rather than an empty body, since this publishes straight away.
          args=(--title "$name" --generate-notes --latest)
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            "${args[@]}"
          echo "Release $TAG published with app-release.apk attached." >> "$GITHUB_STEP_SUMMARY"

      # The APK is on the release now, so the artifact copy is duplicate storage. It is uploaded
      # before this point rather than skipped, so a publish that fails still leaves the build
      # downloadable instead of throwing away five minutes of work.
      - name: Remove the duplicate APK artifact
        if: inputs.publish && success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
                  --jq '.artifacts[] | select(.name | startswith("acalc-")) | .id')
          if [ -z "$ids" ]; then
            echo "No APK artifact to remove."
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "Deleted artifact $id"
          done
          echo "APK artifact removed — download it from the release instead." >> "$GITHUB_STEP_SUMMARY"
