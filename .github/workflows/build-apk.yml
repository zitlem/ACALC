name: Build APK

# Manual only — nothing runs on push. Start it from the Actions tab
# ("Build APK" -> "Run workflow") or with: gh workflow run "Build APK"
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which APK to build'
        type: choice
        options: [debug, release]
        default: release
      run_tests:
        description: 'Run the test suite first'
        type: boolean
        default: true
      publish:
        description: 'Attach the APK to a GitHub Release (release variant only)'
        type: boolean
        default: false
      tag:
        description: 'Release tag, e.g. v1.3 — must match versionName in build.gradle.kts'
        type: string
      title:
        description: 'Short release title, e.g. "Converter touch target fix" (optional)'
        type: string
      draft:
        description: 'Create the release as a draft so notes can be written before publishing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.variant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Fail before spending five minutes on a build that cannot be published.
      - name: Check publish inputs
        if: inputs.publish
        run: |
          if [ "${{ inputs.variant }}" != "release" ]; then
            echo "::error::publish requires variant=release — every published release so far ships app-release.apk"
            exit 1
          fi
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::publish requires a tag, e.g. v1.3"
            exit 1
          fi
          # build.gradle.kts stays the source of truth for the version, as it has been for every
          # release so far; this only stops a v1.3 tag shipping an APK that reports itself as 1.2.
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          expected="v${version_name}"
          if [ "${{ inputs.tag }}" != "$expected" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match versionName ${version_name} (expected ${expected})."
            echo "::error::Bump versionName and versionCode in app/build.gradle.kts first."
            exit 1
          fi
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::release ${{ inputs.tag }} already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # signingConfigs.release reads ${user.home}/.android/debug.keystore. Put a keystore at that
      # exact path so the build works with no change to build.gradle.kts.
      #
      # With the ANDROID_KEYSTORE_BASE64 secret set, that is the same key local builds use and the
      # APK installs straight over an existing copy. Without it, one is generated here so the build
      # still succeeds — Android cannot install an unsigned APK, so signing with *something* is not
      # optional. That key differs every run, so those APKs need the old version uninstalled first.
      - name: Provide a signing keystore
        if: inputs.variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Signed with the project keystore — installs over an existing copy." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so a throwaway key was generated."
            echo "::warning::Uninstall any existing ACALC before installing this APK."
            {
              echo "### Signed with a generated CI key"
              echo ""
              echo "Uninstall any existing copy of ACALC before installing this APK — Android"
              echo "refuses to update an app when the signature changes, and this key is new"
              echo "every run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Unit tests and the Robolectric Compose UI tests both run on the JVM,
      # so the whole suite works on a plain runner with no emulator.
      - name: Run tests
        if: inputs.run_tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew ${{ inputs.variant == 'release' && 'assembleRelease' || 'assembleDebug' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acalc-${{ inputs.variant }}-apk
          path: app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: inputs.run_tests && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

      # Matches the existing releases: tag vX.Y, title "vX.Y — short description"
      # (or just the tag when no title is given), and one asset named app-release.apk.
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ inputs.tag }}"
          if [ -n "${{ inputs.title }}" ]; then
            name="${{ inputs.tag }} — ${{ inputs.title }}"
          fi
          args=(--title "$name" --notes "")
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "${{ inputs.tag }}" \
            app/build/outputs/apk/release/app-release.apk \
            "${args[@]}"
          echo "Release ${{ inputs.tag }} created with app-release.apk attached." >> "$GITHUB_STEP_SUMMARY"
