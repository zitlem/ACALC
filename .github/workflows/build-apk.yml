name: Build APK

# Manual only — nothing runs on push. Start it from the Actions tab
# ("Build APK" -> "Run workflow") or with: gh workflow run "Build APK"
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which APK to build'
        type: choice
        options: [debug, release]
        default: debug
      run_tests:
        description: 'Run the test suite first'
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ inputs.variant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # signingConfigs.release reads ${user.home}/.android/debug.keystore, so restoring the
      # keystore to that exact path signs CI builds with the same key as local ones — which is
      # what lets the resulting APK install over an already-installed copy of the app.
      - name: Restore signing keystore
        if: inputs.variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set, so a release build would be"
            echo "::error::signed with a throwaway key and refuse to install over the existing app."
            echo "::error::Add it with:  base64 -i ~/.android/debug.keystore | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"

      # Unit tests and the Robolectric Compose UI tests both run on the JVM,
      # so the whole suite works on a plain runner with no emulator.
      - name: Run tests
        if: inputs.run_tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew ${{ inputs.variant == 'release' && 'assembleRelease' || 'assembleDebug' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acalc-${{ inputs.variant }}-apk
          path: app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: inputs.run_tests && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
